<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARC STORE | لوحة التحكم والمنتجات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #08080c;
      --bg-card: #12121a;
      --accent-red: #ff003c;
      --text-main: #ffffff;
      --text-muted: #8a8a9e;
      --border: #222230;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 25px; }

    .header-admin {
      display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px;
      border-bottom: 1px solid var(--border); margin-bottom: 30px;
    }

    .login-overlay {
      position: fixed; inset: 0; background: #000; z-index: 9999; display: flex;
      justify-content: center; align-items: center; padding: 20px;
    }
    .login-card {
      background: var(--bg-card); border: 1px solid var(--accent-red); padding: 35px;
      border-radius: 20px; width: 100%; max-width: 400px; text-align: center;
    }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-bottom: 35px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 18px; }
    .stat-card h4 { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 8px; }
    .stat-card .val { font-size: 1.8rem; font-weight: 900; color: #fff; }

    .nav-tabs { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn {
      background: transparent; border: none; color: var(--text-muted); font-size: 1.05rem;
      font-weight: 700; cursor: pointer; padding: 8px 16px;
    }
    .tab-btn.active { color: var(--accent-red); border-bottom: 2px solid var(--accent-red); }

    .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--bg-card); border-radius: 12px; overflow: hidden; font-size: 0.9rem; }
    .admin-table th, .admin-table td { border: 1px solid var(--border); padding: 12px; text-align: right; }
    .admin-table th { background: #1a1a26; color: var(--accent-red); }

    .status-select {
      background: #000; color: #fff; border: 1px solid var(--border); padding: 5px 8px; border-radius: 6px; outline: none; font-size: 0.85rem; cursor: pointer;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 700; }
    .form-control {
      width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
      color: #fff; border-radius: 8px; outline: none; font-size: 0.95rem;
    }

    .btn-action {
      background: var(--accent-red); color: #fff; border: none; padding: 10px 20px;
      border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s;
    }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none;
      justify-content: center; align-items: center; padding: 20px;
    }
    .modal-content { background: var(--bg-card); border: 1px solid var(--border); width: 100%; max-width: 500px; padding: 25px; border-radius: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="login-overlay" id="loginScreen">
    <div class="login-card">
      <h2 style="margin-bottom: 20px;"><i class="fa-solid fa-lock" style="color:var(--accent-red)"></i> لوحة تحكم ARC</h2>
      <input type="password" id="passInput" placeholder="أدخل رمز المرور" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background:#000; color:#fff; margin-bottom: 15px; outline:none;">
      <button class="btn-action" style="width: 100%;" onclick="unlockAdmin()">دخول الصفحة</button>
    </div>
  </div>

  <div class="header-admin">
    <h2><i class="fa-solid fa-sliders" style="color:var(--accent-red)"></i> لوحة إعدادات ARC STORE</h2>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <h4>إجمالي الطلبات</h4>
      <div class="val" id="statOrdersCount">0</div>
    </div>
    <div class="stat-card">
      <h4>طلبات تم تسليمها</h4>
      <div class="val" id="statCompletedCount" style="color:#34d399">0</div>
    </div>
    <div class="stat-card">
      <h4>عدد الأقسام بالمتجر</h4>
      <div class="val" id="statCategoriesCount">0</div>
    </div>
    <div class="stat-card">
      <h4>إجمالي المنتجات</h4>
      <div class="val" id="statProductsCount">0</div>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="showTab('ordersTab', this)">الطلبات الواردة والتسليم</button>
    <button class="tab-btn" onclick="showTab('categoriesTab', this)">إدارة أقسام المتجر (الكتابة فوق)</button>
    <button class="tab-btn" onclick="showTab('productsTab', this)">إدارة المنتجات والأسعار</button>
    <button class="tab-btn" onclick="showTab('settingsTab', this)">الإعدادات العامة</button>
  </div>

  <!-- Tab 1: Orders -->
  <div id="ordersTab">
    <div style="overflow-x: auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>المنتج</th>
            <th>الكمية</th>
            <th>المبلغ</th>
            <th>طريقة الدفع</th>
            <th>بيانات التفعيل</th>
            <th>التاريخ</th>
            <th>حالة الطلب</th>
            <th>مدة التسليم</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Tab 2: Categories Management -->
  <div id="categoriesTab" class="hidden">
    <button class="btn-action" style="margin-bottom: 20px;" onclick="openCategoryModal()"><i class="fa-solid fa-plus"></i> إضافة قسم جديد</button>
    <div id="categoriesList"></div>
  </div>

  <!-- Tab 3: Products -->
  <div id="productsTab" class="hidden">
    <button class="btn-action" style="margin-bottom: 20px;" onclick="openProductModal()"><i class="fa-solid fa-plus"></i> إضافة منتج جديد</button>
    <div id="productsList"></div>
  </div>

  <!-- Tab 4: Settings -->
  <div id="settingsTab" class="hidden" style="max-width: 500px;">
    <div class="form-group">
      <label>رقم الواتساب لاستلام الطلبات (مع الرمز الدولي بدون +)</label>
      <input type="text" id="settingPhone" class="form-control" placeholder="مثال: 971501234567">
    </div>
    <div class="form-group">
      <label>كلمة سر جديدة للوحة التحكم</label>
      <input type="password" id="settingPass" class="form-control" placeholder="كلمة السر الجديدة">
    </div>
    <button class="btn-action" onclick="saveSettings()">حفظ التعديلات</button>
  </div>

  <!-- Modal: Add Category -->
  <div class="modal" id="catModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">إضافة قسم جديد</h3>
      <form onsubmit="handleSaveCategory(event)">
        <div class="form-group">
          <label>اسم القسم (الذي يظهر فوق)</label>
          <input type="text" id="cName" class="form-control" placeholder="مثال: الاشتراكات، بطاقات ألعاب، تزويد..." required>
        </div>

        <div class="form-group">
          <label>نوع القسم وطريقة التزويد</label>
          <select id="cType" class="form-control">
            <option value="unit">👑 قسم اشتراكات وبطاقات (السعر للقطعة/الحبة - أقل كمية 1)</option>
            <option value="boost">🚀 قسم خدمات بالكميات (السعر لكل 1000 - أقل كمية 250)</option>
          </select>
        </div>

        <div class="form-group">
          <label>أيقونة القسم</label>
          <select id="cIcon" class="form-control">
            <option value="fa-crown">👑 اشتراكات (fa-crown)</option>
            <option value="fa-rocket">🚀 دعم وتفاعل (fa-rocket)</option>
            <option value="fa-gamepad">🎮 بطاقات ألعاب (fa-gamepad)</option>
            <option value="fa-tv">📺 شاشات وبث (fa-tv)</option>
            <option value="fa-gift">🎁 هدايا (fa-gift)</option>
            <option value="fa-bolt">⚡ آخر (fa-bolt)</option>
          </select>
        </div>

        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button type="button" onclick="closeCatModal()" style="background:#555; color:#fff; border:none; padding:10px 15px; border-radius:8px; cursor:pointer;">إلغاء</button>
          <button type="submit" class="btn-action">حفظ القسم</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Add Product -->
  <div class="modal" id="prodModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">إضافة منتج جديد</h3>
      <form onsubmit="handleSaveProduct(event)">
        <div class="form-group">
          <label>اسم المنتج أو الخدمة</label>
          <input type="text" id="pTitle" class="form-control" placeholder="مثال: اشتراك نتفليكس شهر" required>
        </div>

        <div class="form-group">
          <label>القسم التابع له</label>
          <select id="pCategory" class="form-control"></select>
        </div>

        <div class="form-group">
          <label>السعر الأساسي بالدولار ($)</label>
          <input type="number" step="0.01" id="pPrice" class="form-control" placeholder="5.00" required>
          <small style="color:var(--text-muted)">* يتحول تلقائياً لـ AED و SAR بالمتجر</small>
        </div>

        <div class="form-group">
          <label>رابط صورة المنتج (URL)</label>
          <input type="url" id="pImage" class="form-control" placeholder="https://..." required>
        </div>

        <div class="form-group">
          <label>الوصف</label>
          <textarea id="pDesc" class="form-control" rows="3" placeholder="أدخل تفاصيل المنتج..."></textarea>
        </div>

        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button type="button" onclick="closeProdModal()" style="background:#555; color:#fff; border:none; padding:10px 15px; border-radius:8px; cursor:pointer;">إلغاء</button>
          <button type="submit" class="btn-action">حفظ المنتج</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let categories = JSON.parse(localStorage.getItem('arc_categories')) || [];
    let products = JSON.parse(localStorage.getItem('arc_products')) || [];
    let orders = JSON.parse(localStorage.getItem('arc_orders')) || [];
    let settings = JSON.parse(localStorage.getItem('arc_settings')) || { whatsapp: '971500000000', password: '1234' };

    function unlockAdmin() {
      const p = document.getElementById('passInput').value;
      if(p === settings.password) {
        document.getElementById('loginScreen').style.display = 'none';
        initAdmin();
      } else alert('رمز المرور خاطئ!');
    }

    function initAdmin() {
      const completedOrders = orders.filter(o => o.status === 'تم التسليم').length;
      document.getElementById('statOrdersCount').innerText = orders.length;
      document.getElementById('statCompletedCount').innerText = completedOrders;
      document.getElementById('statCategoriesCount').innerText = categories.length;
      document.getElementById('statProductsCount').innerText = products.length;
      document.getElementById('settingPhone').value = settings.whatsapp;
      renderOrders();
      renderCategories();
      renderProducts();
      populateCategorySelect();
    }

    function showTab(id, btn) {
      document.querySelectorAll('.nav-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('ordersTab').classList.add('hidden');
      document.getElementById('categoriesTab').classList.add('hidden');
      document.getElementById('productsTab').classList.add('hidden');
      document.getElementById('settingsTab').classList.add('hidden');
      document.getElementById(id).classList.remove('hidden');
    }

    function renderOrders() {
      const tbody = document.getElementById('ordersTableBody');
      tbody.innerHTML = '';

      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:var(--text-muted);">لا توجد طلبات واردة حالياً.</td></tr>`;
        return;
      }

      orders.forEach((o, i) => {
        const currentStatus = o.status || 'قيد الانتظار';
        tbody.innerHTML += `
          <tr>
            <td>${i+1}</td>
            <td><strong>${o.productTitle}</strong></td>
            <td>${o.quantity}</td>
            <td><span style="color:var(--accent-red); font-weight:bold;">${o.totalPrice}</span></td>
            <td>${o.payMethod || 'بطاقة'}</td>
            <td><span style="word-break:break-all;">${o.targetUrl}</span></td>
            <td><small style="color:var(--text-muted);">${o.date || '-'}</small></td>
            <td>
              <select class="status-select" onchange="updateOrderStatus('${o.id}', this.value)">
                <option value="قيد الانتظار" ${currentStatus === 'قيد الانتظار' ? 'selected' : ''}>⏳ قيد الانتظار</option>
                <option value="تم التسليم" ${currentStatus === 'تم التسليم' ? 'selected' : ''}>✅ تم التسليم</option>
                <option value="تم الإلغاء" ${currentStatus === 'تم الإلغاء' ? 'selected' : ''}>❌ تم الإلغاء</option>
              </select>
            </td>
            <td>${o.deliveryTime || '-'}</td>
            <td><button onclick="delOrder('${o.id}')" style="background:#d32f2f; color:#fff; border:none; padding:5px 10px; border-radius:6px; cursor:pointer;"><i class="fa-solid fa-trash"></i></button></td>
          </tr>
        `;
      });
    }

    function updateOrderStatus(orderId, newStatus) {
      const order = orders.find(o => o.id === orderId);
      if(!order) return;

      order.status = newStatus;
      if (newStatus === 'تم التسليم') {
        const timeInput = prompt('أدخل مدة التسليم التي استغرقها الطلب (مثال: خلال 15 دقيقة / فوري):', order.deliveryTime || 'فوراً');
        if (timeInput) order.deliveryTime = timeInput;
      }

      localStorage.setItem('arc_orders', JSON.stringify(orders));
      initAdmin();
    }

    function renderCategories() {
      const box = document.getElementById('categoriesList');
      box.innerHTML = '';
      if(categories.length === 0) {
        box.innerHTML = `<p style="color:var(--text-muted);">لا توجد أقسام. اضغط على "+ إضافة قسم جديد" لإضافة قسم ظهر بالأعلى في المتجر.</p>`;
        return;
      }
      categories.forEach((c) => {
        const typeText = c.type === 'boost' ? 'قسم خدمات بالكميات (أقل كمية 250)' : 'قسم اشتراكات وبطاقات بالحبة';
        box.innerHTML += `
          <div style="background:var(--bg-card); border:1px solid var(--border); padding:15px; border-radius:12px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <i class="fa-solid ${c.icon}" style="color:var(--accent-red); margin-left:10px;"></i>
              <strong style="font-size:1.1rem;">${c.name}</strong>
              <div style="color:var(--text-muted); font-size:0.85rem; margin-top:3px;">${typeText}</div>
            </div>
            <button onclick="delCategory('${c.id}')" style="background:#d32f2f; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;"><i class="fa-solid fa-trash"></i> حذف القسم</button>
          </div>
        `;
      });
    }

    function populateCategorySelect() {
      const select = document.getElementById('pCategory');
      select.innerHTML = '';
      if(categories.length === 0) {
        select.innerHTML = `<option value="">لا توجد أقسام، أنشئ قسماً أولاً</option>`;
        return;
      }
      categories.forEach(c => {
        select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      });
    }

    function renderProducts() {
      const box = document.getElementById('productsList');
      box.innerHTML = '';
      if(products.length === 0) {
        box.innerHTML = `<p style="color:var(--text-muted);">لا توجد منتجات مضافة حتى الآن.</p>`;
        return;
      }
      products.forEach((p) => {
        const cat = categories.find(c => c.id === p.category);
        const unitSuffix = (cat && cat.type === 'boost') ? '/ 1000' : '';
        box.innerHTML += `
          <div style="background:var(--bg-card); border:1px solid var(--border); padding:15px; border-radius:12px; margin-bottom:12px; display:flex; gap:15px; align-items:center;">
            <img src="${p.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&q=80'}" style="width:70px; height:70px; object-fit:cover; border-radius:8px;">
            <div style="flex-grow:1;">
              <strong style="font-size:1.1rem;">${p.title}</strong>
              <div style="color:var(--text-muted); font-size:0.85rem;">القسم: ${cat ? cat.name : 'غير محدد'}</div>
              <div style="color:var(--accent-red); font-weight:bold; margin-top:4px;">${p.priceUSD || p.price}$ ${unitSuffix}</div>
            </div>
            <button onclick="delProd('${p.id}')" style="background:#d32f2f; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;"><i class="fa-solid fa-trash"></i> حذف المنتج</button>
          </div>
        `;
      });
    }

    function openCategoryModal() { document.getElementById('catModal').style.display = 'flex'; }
    function closeCatModal() { document.getElementById('catModal').style.display = 'none'; }

    function openProductModal() { 
      if(categories.length === 0) {
        alert('يرجى إضافة قسم أولاً من تبويب (إدارة أقسام المتجر)!');
        return;
      }
      populateCategorySelect();
      document.getElementById('prodModal').style.display = 'flex'; 
    }
    function closeProdModal() { document.getElementById('prodModal').style.display = 'none'; }

    function handleSaveCategory(e) {
      e.preventDefault();
      const newCat = {
        id: 'cat_' + Date.now(),
        name: document.getElementById('cName').value,
        type: document.getElementById('cType').value,
        icon: document.getElementById('cIcon').value
      };
      categories.push(newCat);
      localStorage.setItem('arc_categories', JSON.stringify(categories));
      closeCatModal();
      initAdmin();
    }

    function handleSaveProduct(e) {
      e.preventDefault();
      const catVal = document.getElementById('pCategory').value;
      if(!catVal) { alert('اختر قسماً للمنتج'); return; }

      const newProd = {
        id: Date.now().toString(),
        title: document.getElementById('pTitle').value,
        category: catVal,
        priceUSD: parseFloat(document.getElementById('pPrice').value),
        image: document.getElementById('pImage').value,
        desc: document.getElementById('pDesc').value
      };

      products.push(newProd);
      localStorage.setItem('arc_products', JSON.stringify(products));
      closeProdModal();
      initAdmin();
    }

    function delCategory(id) {
      if(confirm('هل أنت تأكد من حذف هذا القسم؟')) {
        categories = categories.filter(c => c.id !== id);
        localStorage.setItem('arc_categories', JSON.stringify(categories));
        initAdmin();
      }
    }

    function delOrder(id) {
      if(confirm('هل أنت تأكد من حذف هذا الطلب؟')) {
        orders = orders.filter(o => o.id !== id);
        localStorage.setItem('arc_orders', JSON.stringify(orders));
        initAdmin();
      }
    }

    function delProd(id) {
      if(confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('arc_products', JSON.stringify(products));
        initAdmin();
      }
    }

    function saveSettings() {
      const phone = document.getElementById('settingPhone').value.trim();
      const pass = document.getElementById('settingPass').value.trim();
      if(phone) settings.whatsapp = phone;
      if(pass) settings.password = pass;
      localStorage.setItem('arc_settings', JSON.stringify(settings));
      alert('تم حفظ البيانات بنجاح!');
    }
  </script>
</body>
</html>
