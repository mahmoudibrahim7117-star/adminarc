<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARC STORE | لوحة الإدارة</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#050506;--pn:#0e0e10;--rd:#ff1a2e;--rd2:#ff4d5e;--mt:#9a9aa3;--ln:rgba(255,26,46,.28);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:#fff;font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.7;overflow-x:hidden;background-image:linear-gradient(rgba(255,26,46,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,26,46,.07) 1px,transparent 1px);background-size:44px 44px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0,rgba(255,26,46,.18),transparent 60%),radial-gradient(ellipse at center,transparent 40%,#000 100%);pointer-events:none;z-index:0}
main,header,footer{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.btn{display:inline-block;border:1.5px solid var(--rd);background:var(--rd);color:#fff;padding:11px 28px;border-radius:10px;font-weight:800;cursor:pointer;box-shadow:0 0 18px rgba(255,26,46,.65);transition:.25s}
.btn:hover{box-shadow:0 0 32px var(--rd);transform:translateY(-2px)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--rd2)}
.btn.ghost:hover{background:rgba(255,26,46,.12)}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.tab{border:1px solid var(--ln);background:var(--pn);padding:8px 20px;border-radius:99px;cursor:pointer;font-weight:700;transition:.25s}
.tab.on,.tab:hover{border-color:var(--rd);box-shadow:0 0 14px rgba(255,26,46,.6)}
.tab.on{background:rgba(255,26,46,.18)}
.pimg{aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#000;border:1px solid #1d1d22;display:flex;align-items:center;justify-content:center}
.pimg img{width:100%;height:100%;object-fit:cover}
.ph{direction:ltr;font-weight:900;font-size:2rem;letter-spacing:.15em;color:var(--rd);text-shadow:0 0 14px var(--rd)}
.fld{width:100%;background:#000;border:1px solid var(--ln);border-radius:10px;padding:8px 12px;outline:0}
.fld:focus{border-color:var(--rd);box-shadow:0 0 12px rgba(255,26,46,.5)}
select.fld option{background:#000}
.x{background:none;border:1px solid var(--ln);color:var(--rd2);border-radius:8px;cursor:pointer;padding:5px 12px}
.x:hover{background:var(--rd);color:#fff}
#adm{position:fixed;inset:0;z-index:60;background:#000;overflow-y:auto;display:block}
.box{max-width:900px;margin:0 auto;padding:20px 18px 60px}
.lg{max-width:360px;margin:16vh auto;text-align:center;background:var(--pn);border:1px solid var(--rd);border-radius:16px;padding:28px;box-shadow:0 0 30px rgba(255,26,46,.4)}
.ap{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:16px 0}
.ap h3{margin:0 0 12px;color:var(--rd2)}
.ec{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:8px}
.pe{border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:150px 1fr;gap:14px;background:#000}
@media(max-width:640px){.pe{grid-template-columns:1fr}}
.pe .pimg{aspect-ratio:1}
.ff{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ff label,.ap label{display:block;font-size:.8rem;color:var(--mt);margin:0 0 3px}
.up{margin-top:8px;display:block;text-align:center;font-size:.85rem;border:1px dashed var(--rd);border-radius:8px;padding:5px;cursor:pointer;color:var(--rd2)}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--rd);padding:10px 22px;border-radius:10px;z-index:99;box-shadow:0 0 24px var(--rd);display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.hint{font-size:.85rem;color:var(--mt);margin:4px 0}textarea.fld{resize:vertical}.cr{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #1d1d22}.full{grid-column:1/-1}
</style>
</head>
<body>
<div id="adm"><div class="box" id="admBox"></div></div>
<div class="tt" id="tt"></div>
<script>
var DEF={"wa":"966500000000","pass":"1234","rates":{"AED":1,"SAR":1.02,"USD":0.2723},"cats":[{"id":"c1","name":"المتابعين"},{"id":"c2","name":"المشاهدات"},{"id":"c3","name":"الاشتراكات"}],"prods":[{"id":"p1","cat":"c1","name":"متابعين انستغرام","price":15,"per":1000,"min":250,"max":100000,"unit":"متابع","img":"","desc":"متابعين لحساب انستغرام. يبدأ التنفيذ بعد تأكيد الطلب.","eta":"من 1 إلى 24 ساعة"},{"id":"p2","cat":"c1","name":"متابعين تيك توك","price":18,"per":1000,"min":250,"max":100000,"unit":"متابع","img":"","desc":"متابعين لحساب تيك توك. يبدأ التنفيذ بعد تأكيد الطلب.","eta":"من 1 إلى 24 ساعة"},{"id":"p3","cat":"c2","name":"مشاهدات تيك توك","price":2.2,"per":1000,"min":250,"max":1000000,"unit":"مشاهدة","img":"","desc":"مشاهدات لفيديوهات تيك توك. أرسل رابط الفيديو عند الطلب.","eta":"خلال 6 ساعات"},{"id":"p4","cat":"c2","name":"مشاهدات انستغرام ريلز","price":2,"per":1000,"min":250,"max":1000000,"unit":"مشاهدة","img":"","desc":"مشاهدات لريلز انستغرام. أرسل رابط الريلز عند الطلب.","eta":"خلال 6 ساعات"},{"id":"p5","cat":"c3","name":"اشتراك نتفليكس شهر","price":15,"per":1,"min":1,"max":12,"unit":"اشتراك","img":"","desc":"اشتراك نتفليكس لمدة شهر. أرسل بريدك عند الطلب.","eta":"خلال ساعة"},{"id":"p6","cat":"c3","name":"اشتراك سبوتيفاي شهر","price":11,"per":1,"min":1,"max":12,"unit":"اشتراك","img":"","desc":"اشتراك سبوتيفاي لمدة شهر. أرسل بريدك عند الطلب.","eta":"خلال ساعة"}],"codes":[]};

var S;
try{S=JSON.parse(localStorage.getItem('arcstore_data'))||DEF;}catch(e){S=DEF;}
S.codes=S.codes||[];S.prods.forEach(function(p){p.desc=p.desc||'';p.eta=p.eta||''});
var tab='prods';

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&','<':'<','>':'>','"':'"'}[c]})}
function toast(m){var t=$('tt');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},2800)}
function img(p){return p.img?'<img src="'+p.img+'" alt="">':'<div class="ph">ARC</div>'}
function save(){try{localStorage.setItem('arcstore_data',JSON.stringify(S));toast('تم الحفظ تلقائياً ✓');}catch(e){toast('تعذر الحفظ (الصورة كبيرة جداً)');}}
function A(){return $('admBox')}

function openAdm(){
 A().innerHTML='<div class="lg"><div class="logo" style="justify-content:center;margin-bottom:14px"><b>ARC</b><i>STORE</i></div><h3>دخول الإدارة</h3><input class="fld" id="pw" type="password" placeholder="كلمة المرور" style="text-align:center"><div class="err" id="pe"></div><button class="btn" id="lg" style="width:100%">دخول</button></div>';
 $('pw').onkeydown=function(e){if(e.key==='Enter')$('lg').click()};$('lg').onclick=function(){if($('pw').value===S.pass){panel()}else$('pe').textContent='كلمة المرور غير صحيحة'}
}

function panel(){var st=$('adm').scrollTop;
 var h='<div class="top"><h2>لوحة التحكم</h2><div><a class="btn ghost" href="index.html" target="_blank">معاينة المتجر ↗</a></div></div><p class="hint">أي تعديل تضيفه (منتجات، أسعار، رقم واتساب) يتم حفظه فورا وتلقائيا دون أي ملفات.</p>';
 h+='<div class="tabs">'+[['prods','المنتجات والأقسام'],['codes','أكواد الخصم'],['set','الإعدادات']].map(function(t){return '<button class="tab'+(tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>';
 h+=({prods:vProds,codes:vCodes,set:vSet})[tab]();
 A().innerHTML=h;$('adm').scrollTop=st;
}

function vProds(){
 var h='<div class="ap"><h3>الأقسام</h3>'+S.cats.map(function(c,i){return '<div class="ec"><input class="fld" data-k="cat" data-i="'+i+'" value="'+esc(c.name)+'"><button class="x" data-dc="'+i+'">حذف</button></div>'}).join('')+'<button class="btn ghost" id="ac">+ إضافة قسم</button></div>';
 return h+'<div class="ap"><h3>المنتجات</h3>'+S.prods.map(function(p,i){var d='data-i="'+i+'" ';
  return '<div class="pe"><div><div class="pimg">'+img(p)+'</div><label class="up">'+(p.img?'تغيير الصورة':'رفع صورة')+'<input type="file" accept="image/*" data-up="'+i+'" hidden></label>'+(p.img?'<a class="up" data-ri="'+i+'">حذف الصورة</a>':'')+'</div><div><div class="ff">'+
  fl('الاسم','<input class="fld" '+d+'data-k="name" value="'+esc(p.name)+'">')+
  fl('القسم','<select class="fld" '+d+'data-k="pcat">'+S.cats.map(function(c){return '<option value="'+c.id+'"'+(c.id===p.cat?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select>')+
  fl('السعر بالدرهم','<input class="fld" type="number" step="any" min="0" '+d+'data-k="price" value="'+p.price+'">')+
  fl('السعر قبل الخصم (اختياري)','<input class="fld" type="number" step="any" min="0" '+d+'data-k="old" value="'+(p.old||'')+'" placeholder="فارغ = بدون خصم">')+
  fl('السعر لكل (كمية)','<input class="fld" type="number" min="1" '+d+'data-k="per" value="'+p.per+'">')+
  fl('أقل كمية','<input class="fld" type="number" min="1" '+d+'data-k="min" value="'+p.min+'">')+
  fl('أكثر كمية','<input class="fld" type="number" min="1" '+d+'data-k="max" value="'+p.max+'">')+
  fl('الوحدة','<input class="fld" '+d+'data-k="unit" value="'+esc(p.unit)+'">')+
  fl('مدة التنفيذ','<input class="fld" '+d+'data-k="eta" value="'+esc(p.eta)+'" placeholder="مثال: خلال 24 ساعة">')+
  '<div class="full"><label>وصف المنتج</label><textarea class="fld" rows="2" '+d+'data-k="desc">'+esc(p.desc)+'</textarea></div>'+
  '</div><div style="margin-top:10px"><button class="x" data-dp="'+i+'">حذف المنتج</button></div></div></div>'}).join('')+'<button class="btn ghost" id="ap">+ إضافة منتج</button></div>';
}

function vCodes(){
 return '<div class="ap"><h3>أكواد الخصم</h3>'+(S.codes.length?'':'<p class="sub">لا توجد أكواد بعد.</p>')+S.codes.map(function(c,i){var d='data-i="'+i+'" ';
 return '<div class="ff cr">'+fl('الكود','<input class="fld" dir="ltr" '+d+'data-cd="code" value="'+esc(c.code)+'">')+fl('النوع','<select class="fld" '+d+'data-cd="type"><option value="p"'+(c.type==='p'?' selected':'')+'>نسبة %</option><option value="f"'+(c.type==='f'?' selected':'')+'>مبلغ ثابت (درهم)</option></select>')+fl('القيمة','<input class="fld" type="number" step="any" min="0" '+d+'data-cd="v" value="'+c.v+'">')+'<div><label>مفعّل</label><input type="checkbox" '+d+'data-cd="on"'+(c.on!==false?' checked':'')+' style="width:22px;height:22px"></div><div style="align-self:end"><button class="x" data-dcd="'+i+'">حذف</button></div></div>'}).join('')+'<button class="btn ghost" id="acd">+ إضافة كود</button></div>';
}

function vSet(){
 return '<div class="ap"><h3>الإعدادات</h3><div class="ff">'+fl('رقم واتساب (مع رمز الدولة)','<input class="fld" data-s="wa" value="'+esc(S.wa)+'">')+fl('1 درهم = كم ريال','<input class="fld" type="number" step="any" data-r="SAR" value="'+S.rates.SAR+'">')+fl('1 درهم = كم دولار','<input class="fld" type="number" step="any" data-r="USD" value="'+S.rates.USD+'">')+fl('كلمة مرور الإدارة','<input class="fld" data-s="pass" value="'+esc(S.pass)+'">')+'</div></div>';
}

function fl(l,h){return '<div><label>'+l+'</label>'+h+'</div>'}

function upImg(i,f){if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=520,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.prods[i].img=c.toDataURL('image/jpeg',.82);save();panel()};im.src=r.result};r.readAsDataURL(f)}

A().onclick=function(e){var t=e.target,d=t.dataset;
 if(d.tab){tab=d.tab;panel();return}
 if(t.id==='ac'){S.cats.push({id:'c'+Date.now(),name:'قسم جديد'});save();panel();return}
 if(t.id==='ap'){if(!S.cats.length){toast('أضف قسماً أولاً');return}S.prods.push({id:'p'+Date.now(),cat:S.cats[0].id,name:'منتج جديد',desc:'',eta:'',price:10,per:1000,min:250,max:100000,unit:'وحدة',img:''});save();panel();return}
 if(t.id==='acd'){S.codes.push({code:'CODE'+Math.floor(Math.random()*900+100),type:'p',v:10,on:true});save();panel();return}
 if(d.dc!==undefined){var id=S.cats[d.dc].id;if(S.prods.some(function(p){return p.cat===id})&&!confirm('سيتم حذف المنتجات التابعة للقسم. متابعة؟'))return;S.prods=S.prods.filter(function(p){return p.cat!==id});S.cats.splice(d.dc,1);save();panel();return}
 if(d.dp!==undefined){if(confirm('حذف هذا المنتج؟')){S.prods.splice(d.dp,1);save();panel()}return}
 if(d.ri!==undefined){S.prods[d.ri].img='';save();panel();return}
 if(d.dcd!==undefined){if(confirm('حذف الكود؟')){S.codes.splice(d.dcd,1);save();panel()}return}
};

function onEdit(e){var t=e.target,d=t.dataset,i=d.i,v=t.value;
 if(d.up!==undefined){if(e.type==='change')upImg(d.up,t.files[0]);return}
 if(d.cd){var c=S.codes[i];if(d.cd==='code')v=v.toUpperCase().replace(/\s/g,'');if(d.cd==='v')v=Math.max(0,parseFloat(v)||0);if(d.cd==='on')v=t.checked;c[d.cd]=v;save();return}
 if(d.k==='cat'){S.cats[i].name=v}
 else if(d.k==='pcat'){S.prods[i].cat=v}
 else if(d.k){var k=d.k;if(k==='price'||k==='old')v=Math.max(0,parseFloat(v)||0);if(k==='per'||k==='min'||k==='max')v=Math.max(1,parseInt(v)||1);S.prods[i][k]=v}
 else if(d.s){if(d.s==='pass'&&!v)return;S[d.s]=v}
 else if(d.r){S.rates[d.r]=parseFloat(v)||S.rates[d.r]}
 else return;
 save()}

A().oninput=A().onchange=onEdit;
openAdm();
</script>
</body>
</html>
