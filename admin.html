}

 return '<div class="oc"><div class="oh"><b>'+n+'</b><span class="bd s-'+o.st+'">'+ST[o.st]+'</span><span class="hint">'+new Date(o.t).toLocaleString('en-GB')+'</span></div><div class="og"><div><div class="hint">العميل</div><b>'+esc(o.nm)+'</b><div dir="ltr" style="text-align:right">'+esc(o.em)+'</div><a class="wl" target="_blank" href="https://wa.me/'+ph+'" dir="ltr">+'+esc(ph)+' (واتساب)</a></div><div><div class="hint">الطلب</div>'+o.it.map(function(x){return '<div>• '+esc(x.n)+' × '+Number(x.q).toLocaleString('en-US')+' '+esc(x.u)+' — '+fm(x.l,o.cur)+'<div class="hint">الحساب: '+esc(x.a)+'</div></div>'}).join('')+(o.cd?'<div class="hint">كود الخصم: '+esc(o.cd)+' (−'+fm(o.ds,o.cur)+')</div>':'')+'<div><b>الإجمالي: '+fm(o.tt,o.cur)+'</b></div></div></div><div class="ff">'+
 fl('حالة الطلب','<select class="fld" data-o="st" data-no="'+n+'">'+Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(o.st===k?' selected':'')+'>'+ST[k]+'</option>'}).join('')+'</select>')+
 fl('مدة التنفيذ','<input class="fld" data-o="eta" data-no="'+n+'" value="'+esc(o.eta)+'" placeholder="مثال: خلال 24 ساعة">')+
 fl('ملاحظات','<input class="fld" data-o="note" data-no="'+n+'" value="'+esc(o.note)+'">')+'</div><div style="margin-top:8px"><button class="x" data-delo="'+n+'">حذف الطلب</button></div></div>'}
function vProds(){
 var h='<div class="ap"><h3>الأقسام</h3>'+S.cats.map(function(c,i){return '<div class="ec"><input class="fld" data-k="cat" data-i="'+i+'" value="'+esc(c.name)+'"><button class="x" data-dc="'+i+'">حذف</button></div>'}).join('')+'<button class="btn ghost" id="ac">+ إضافة قسم</button></div>';
 return h+'<div class="ap"><h3>المنتجات</h3>'+S.prods.map(function(p,i){var d='data-i="'+i+'" ';
  return '<div class="pe"><div><div class="pimg">'+img(p)+'</div><label class="up">'+(p.img?'تغيير الصورة':'رفع صورة')+'<input type="file" accept="image/*" data-up="'+i+'" hidden></label>'+(p.img?'<a class="up" data-ri="'+i+'">حذف الصورة</a>':'')+'</div><div><div class="ff">'+
  fl('الاسم','<input class="fld" '+d+'data-k="name" value="'+esc(p.name)+'">')+
  fl('القسم','<select class="fld" '+d+'data-k="pcat">'+S.cats.map(function(c){return '<option value="'+c.id+'"'+(c.id===p.cat?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select>')+
  fl('السعر بالدرهم','<input class="fld" type="number" step="any" min="0" '+d+'data-k="price" value="'+p.price+'">')+
  fl('السعر قبل الخصم (اختياري)','<input class="fld" type="number" step="any" min="0" '+d+'data-k="old" value="'+(p.old||'')+'" placeholder="فارغ = بدون خصم">')+
  fl('السعر لكل (كمية)','<input class="fld" type="number" min="1" '+d+'data-k="per" value="'+p.per+'">')+
  fl('أقل كمية','<input class="fld" type="number" min="1" '+d+'data-k="min" value="'+p.min+'">')+
  fl('أكثر كمية','<input class="fld" type="number" min="1" '+d+'data-k="max" value="'+p.max+'">')+
  fl('الوحدة','<input class="fld" '+d+'data-k="unit" value="'+esc(p.unit)+'">')+
  fl('مدة التنفيذ','<input class="fld" '+d+'data-k="eta" value="'+esc(p.eta)+'" placeholder="مثال: خلال 24 ساعة">')+
  '<div class="full"><label>وصف المنتج</label><textarea class="fld" rows="2" '+d+'data-k="desc">'+esc(p.desc)+'</textarea></div>'+
  '</div><div style="margin-top:10px"><button class="x" data-dp="'+i+'">حذف المنتج</button></div></div></div>'}).join('')+'<button class="btn ghost" id="ap">+ إضافة منتج</button></div>'}
function vCodes(){return '<div class="ap"><h3>أكواد الخصم</h3>'+(S.codes.length?'':'<p class="sub">لا توجد أكواد بعد.</p>')+S.codes.map(function(c,i){var d='data-i="'+i+'" ';
 return '<div class="ff cr">'+fl('الكود','<input class="fld" dir="ltr" '+d+'data-cd="code" value="'+esc(c.code)+'">')+fl('النوع','<select class="fld" '+d+'data-cd="type"><option value="p"'+(c.type==='p'?' selected':'')+'>نسبة %</option><option value="f"'+(c.type==='f'?' selected':'')+'>مبلغ ثابت (درهم)</option></select>')+fl('القيمة','<input class="fld" type="number" step="any" min="0" '+d+'data-cd="v" value="'+c.v+'">')+'<div><label>مفعّل</label><input type="checkbox" '+d+'data-cd="on"'+(c.on!==false?' checked':'')+' style="width:22px;height:22px"></div><div style="align-self:end"><button class="x" data-dcd="'+i+'">حذف</button></div></div>'}).join('')+'<button class="btn ghost" id="acd">+ إضافة كود</button><p class="hint">بعد التعديل حمّل data.js وارفعه ليعمل الكود للعملاء. تنبيه: الأكواد مخزّنة داخل data.js، فمن يفتح الملف يستطيع قراءتها.</p></div>'}
function vSet(){return '<div class="ap"><h3>الإعدادات</h3><div class="ff">'+fl('رقم واتساب (مع رمز الدولة)','<input class="fld" data-s="wa" value="'+esc(S.wa)+'">')+fl('1 درهم = كم ريال','<input class="fld" type="number" step="any" data-r="SAR" value="'+S.rates.SAR+'">')+fl('1 درهم = كم دولار','<input class="fld" type="number" step="any" data-r="USD" value="'+S.rates.USD+'">')+fl('كلمة مرور الإدارة','<input class="fld" data-s="pass" value="'+esc(S.pass)+'">')+'</div></div>'+vLink()}
function syncText(){if(!S.ordersUrl||!localStorage.getItem(OK2))return '⚪ غير مربوط بالجدول. أدخل رابط الربط والمفتاح من تبويب الإعدادات.';if(syncErr)return '🔴 '+syncErr;return lastSync?'🟢 متصل — آخر تحديث '+lastSync.toLocaleTimeString('en-GB'):'⏳ جارٍ التحديث...'}
function sync(manual){var u=S.ordersUrl,k=localStorage.getItem(OK2);
 if(!u||!k){if(manual===true)toast('أدخل رابط الربط والمفتاح من الإعدادات');return}
 if(manual!==true&&Date.now()-lastPush<4000)return;
 fetch(u+(u.indexOf('?')<0?'?':'&')+'action=list&key='+encodeURIComponent(k)).then(function(r){return r.json()}).then(function(j){
  if(!j||!j.ok){syncErr=j&&j.error==='auth'?'مفتاح الربط غير صحيح':'تعذر قراءة الطلبات'}
  else{syncErr='';lastSync=new Date();var rem=j.orders||[],ids={};rem.forEach(function(o){ids[o.no]=1});
   var fresh=rem.filter(function(o){return known&&!known[o.no]}).length;
   O=rem.concat(O.filter(function(o){return !ids[o.no]})).sort(function(a,b){return b.t-a.t});saveO();
   known={};O.forEach(function(o){known[o.no]=1});
   if(fresh)toast('وصل '+fresh+' طلب جديد 🔔');
   if(tab==='orders'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))panel()}
  var s=$('syncs');if(s)s.textContent=syncText();if(manual===true&&!syncErr)toast('تم التحديث ✓')
 }).catch(function(){syncErr='تعذر الاتصال بالرابط';var s=$('syncs');if(s)s.textContent=syncText()})}
function push(act,o){var u=S.ordersUrl,k=localStorage.getItem(OK2);if(!u||!k)return;lastPush=Date.now();try{fetch(u,{method:'POST',mode:'no-cors',body:JSON.stringify({action:act,key:k,no:o.no,st:o.st,eta:o.eta,note:o.note})})}catch(e){}}
function vLink(){return '<div class="ap"><h3>ربط الطلبات تلقائياً (Google Sheets)</h3><ol class="hint" style="line-height:2;padding-inline-start:20px"><li>أنشئ جدول Google Sheets جديداً، ثم من القائمة: الإضافات ← Apps Script.</li><li>احذف كل ما فيه والصق الكود بالأسفل، وغيّر <b>ADMIN_KEY</b> من CHANGE_ME إلى مفتاح سري من اختيارك.</li><li>اضغط نشر ← نشر جديد ← تطبيق ويب: التنفيذ «أنا»، ومن لديه حق الوصول «أي شخص». ثم انسخ رابط تطبيق الويب.</li><li>الصق الرابط والمفتاح في الخانتين بالأسفل، ثم حمّل data.js واستبدله (الرابط فقط ينتقل للموقع، أما المفتاح فيبقى في هذا المتصفح).</li></ol><div class="ff">'+fl('رابط تطبيق الويب','<input class="fld" dir="ltr" data-s="ordersUrl" value="'+esc(S.ordersUrl||'')+'">')+fl('مفتاح الربط (ADMIN_KEY)','<input class="fld" dir="ltr" data-ok value="'+esc(localStorage.getItem(OK2)||'')+'">')+'</div><label style="margin-top:10px">كود Apps Script</label><textarea class="fld" id="gas" rows="8" dir="ltr" readonly></textarea><button class="btn ghost" id="cpg" style="margin-top:8px">نسخ الكود</button></div>'}
function impOrder(){var m=/ARCX:([A-Za-z0-9+\/=]+)/.exec($('impt').value),o;
 if(!m){toast('لم أجد كود الطلب في الرسالة');return}
 try{o=JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){toast('كود الطلب غير صالح');return}
 if(!o||!o.no||!o.it){toast('كود الطلب غير صالح');return}
 if(O.some(function(x){return x.no===o.no})){toast('هذا الطلب مضاف مسبقاً');return}
 o.st='ordered';o.eta=(o.it[0]&&o.it[0].e)||'';o.note='';O.unshift(o);saveO();tab='orders';ofl='all';panel();toast('تمت إضافة الطلب '+o.no+' ✓')}
function impBackup(f){if(!f)return;var r=new FileReader();r.onload=function(){try{var a=JSON.parse(r.result),n=0;a.forEach(function(o){if(o&&o.no&&!O.some(function(x){return x.no===o.no})){O.push(o);n++}});O.sort(function(a,b){return b.t-a.t});saveO();panel();toast('تم استيراد '+n+' طلب')}catch(e){toast('ملف غير صالح')}};r.readAsText(f)}
function upImg(i,f){if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=520,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.prods[i].img=c.toDataURL('image/jpeg',.82);save();panel()};im.src=r.result};r.readAsDataURL(f)}
A().onclick=function(e){var t=e.target,d=t.dataset;
 if(d.tab){tab=d.tab;panel();return}
 if(d.fl){ofl=d.fl;panel();return}
 if(t.id==='dl'){dlf('data.js','// بيانات المتجر\nwindow.ARC_DATA = '+JSON.stringify(S,null,1)+';\n','text/javascript');toast('تم تحميل data.js ✓ استبدل به الملف القديم');return}
 if(t.id==='ex'){closeAdm();return}
 if(t.id==='imp'){impOrder();return}
 if(t.id==='rf'){sync(true);return}
 if(t.id==='cpg'){var ta=$('gas');ta.select();document.execCommand('copy');toast('تم نسخ الكود');return}
 if(t.id==='bk'){dlf('orders-backup.json',JSON.stringify(O),'application/json');return}
 if(t.id==='ac'){S.cats.push({id:'c'+Date.now(),name:'قسم جديد'});save();panel();return}
 if(t.id==='ap'){if(!S.cats.length){toast('أضف قسماً أولاً');return}S.prods.push({id:'p'+Date.now(),cat:S.cats[0].id,name:'منتج جديد',desc:'',eta:'',price:10,per:1000,min:250,max:100000,unit:'وحدة',img:''});save();panel();return}
 if(t.id==='acd'){S.codes.push({code:'CODE'+Math.floor(Math.random()*900+100),type:'p',v:10,on:true});save();panel();return}
 if(d.dc!==undefined){var id=S.cats[d.dc].id;if(S.prods.some(function(p){return p.cat===id})&&!confirm('سيتم حذف المنتجات التابعة للقسم. متابعة؟'))return;S.prods=S.prods.filter(function(p){return p.cat!==id});S.cats.splice(d.dc,1);save();panel();return}
 if(d.dp!==undefined){if(confirm('حذف هذا المنتج؟')){S.prods.splice(d.dp,1);save();panel()}return}
 if(d.ri!==undefined){S.prods[d.ri].img='';save();panel();return}
 if(d.dcd!==undefined){if(confirm('حذف الكود؟')){S.codes.splice(d.dcd,1);save();panel()}return}
 if(d.delo!==undefined){if(confirm('حذف الطلب؟')){push('delete',{no:d.delo});O=O.filter(function(x){return x.no!==d.delo});saveO();panel()}}};
function onEdit(e){var t=e.target,d=t.dataset,i=d.i,v=t.value;
 if(d.ok!==undefined){localStorage.setItem(OK2,v.trim());return}
 if(d.up!==undefined){if(e.type==='change')upImg(d.up,t.files[0]);return}
 if(d.bk!==undefined){if(e.type==='change')impBackup(t.files[0]);return}
 if(d.o){var o=O.filter(function(x){return x.no===d.no})[0];if(!o)return;o[d.o]=v;saveO();if(e.type==='change'){push('update',o);if(d.o==='st')panel()}return}
 if(d.cd){var c=S.codes[i];if(d.cd==='code')v=v.toUpperCase().replace(/\s/g,'');if(d.cd==='v')v=Math.max(0,parseFloat(v)||0);if(d.cd==='on')v=t.checked;c[d.cd]=v;save();return}
 if(d.k==='cat'){S.cats[i].name=v}
 else if(d.k==='pcat'){S.prods[i].cat=v}
 else if(d.k){var k=d.k;if(k==='price'||k==='old')v=Math.max(0,parseFloat(v)||0);if(k==='per'||k==='min'||k==='max')v=Math.max(1,parseInt(v)||1);S.prods[i][k]=v}
 else if(d.s){if(d.s==='pass'&&!v)return;S[d.s]=d.s==='ordersUrl'?v.trim():v}
 else if(d.r){S.rates[d.r]=parseFloat(v)||S.rates[d.r]}
 else return;
 save()}
A().oninput=A().onchange=onEdit;
openAdm();
